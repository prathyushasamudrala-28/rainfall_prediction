<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RainPredict AI{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- 🌤 Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-bold">🌦 RainPredict AI</span>
            </div>
            <ul class="flex space-x-6 text-lg font-medium">
                <li><a href="/" class="hover:text-yellow-300 transition">Home</a></li>
                <li><a href="/predict" class="hover:text-yellow-300 transition">Predict</a></li>
                <li><a href="/about" class="hover:text-yellow-300 transition">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- 📄 Page Content -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 🌧 Footer -->
    <footer class="bg-blue-700 text-white text-center py-4 mt-10">
        <p class="text-sm">
            © 2025 RainPredict AI | Powered by Flask + Machine Learning
        </p>
        <p class="text-xs mt-1">Stay prepared 🌦 Rain or Shine</p>
    </footer>

</body>
</html>
