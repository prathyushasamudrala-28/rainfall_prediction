{% extends "base.html" %}

{% block title %}Rainfall Prediction{% endblock %}

{% block content %}
<!-- Rainfall Prediction Form Section -->
<div class="min-h-screen flex flex-col justify-center items-center bg-gradient-to-b from-blue-50 to-blue-200 py-10 px-6">

    <!-- Card Container -->
    <div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-3xl">
        <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">
            🌧 Rainfall Prediction
        </h1>

        <p class="text-center text-gray-600 mb-10">
            Enter the following weather details to predict whether it will rain or not.
        </p>

        <!-- Prediction Form -->
        <form action="/predict" method="POST" class="space-y-6">
            <!-- Temperature -->
            <div>
                <label for="temperature" class="block text-gray-800 font-semibold mb-2">
                    Temperature (°C)
                </label>
                <input type="number" step="any" name="temperature" id="temperature" required
                    placeholder="Enter temperature"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Humidity -->
            <div>
                <label for="humidity" class="block text-gray-800 font-semibold mb-2">
                    Humidity (%)
                </label>
                <input type="number" step="any" name="humidity" id="humidity" required
                    placeholder="Enter humidity"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Pressure -->
            <div>
                <label for="pressure" class="block text-gray-800 font-semibold mb-2">
                    Pressure (hPa)
                </label>
                <input type="number" step="any" name="pressure" id="pressure" required
                    placeholder="Enter pressure"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Wind Speed -->
            <div>
                <label for="wind_speed" class="block text-gray-800 font-semibold mb-2">
                    Wind Speed (m/s)
                </label>
                <input type="number" step="any" name="wind_speed" id="wind_speed" required
                    placeholder="Enter wind speed"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Cloud Cover -->
            <div>
                <label for="cloud_cover" class="block text-gray-800 font-semibold mb-2">
                    Cloud Cover (%)
                </label>
                <input type="number" step="any" name="cloud_cover" id="cloud_cover" required
                    placeholder="Enter cloud cover"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Precipitation -->
            <div>
                <label for="precipitation" class="block text-gray-800 font-semibold mb-2">
                    Precipitation (mm)
                </label>
                <input type="number" step="any" name="precipitation" id="precipitation" required
                    placeholder="Enter precipitation"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Dew Point -->
           

            <!-- Submit Button -->
            <div class="flex justify-center mt-6">
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-10 py-3 rounded-xl shadow-md transition transform hover:scale-105">
                    Predict Rainfall
                </button>
            </div>
        </form>

        <!-- Prediction Result -->
        {% if prediction %}
        <div class="mt-10 text-center bg-gray-50 border border-gray-200 rounded-lg py-6 px-4 shadow-inner">
            <h3 class="text-2xl font-semibold text-gray-800 mb-3">Prediction Result:</h3>
            <p class="text-3xl font-extrabold 
                       {% if 'Rain' in prediction %}text-blue-600{% else %}text-yellow-600{% endif %}">
                {{ prediction }}
            </p>
        </div>
        {% endif %}
    </div>

    <!-- Back to Home -->
    <div class="mt-8">
        <a href="/" class="text-blue-700 font-semibold hover:underline text-lg">
            ⬅ Back to Home
        </a>
    </div>
</div>
{% endblock %}
